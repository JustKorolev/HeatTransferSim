name: heatsim
channels:
  - conda-forge
dependencies:
  # --- Python ---
  - python=3.11
  # --- STEP / OpenCASCADE pipeline (conda-only, no pip wheel) ---
  - pythonocc-core=7.9.0
  # --- core numerics ---
  - numpy
  - scipy
  # --- geometry / graph build ---
  - trimesh
  - networkx
  - openpyxl           # Materials.xlsx
  # --- visualization / GUI (needed for viewer + simulation, not headless build) ---
  - matplotlib
  - pyvista
  - pyvistaqt
  - pyside6
  - qtpy
  # --- pip-only wheels (not on conda-forge) ---
  - pip
  - pip:
      - embreex          # fast BVH ray tests for solid fill (PyPI-only, bundles Embree)
